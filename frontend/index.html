      === CONTAINER DES PROJETS (CARTES) ===

    === PANNEAU DES SERVICES (CUSTOM ET COMMON) ===

-->
<div id="panels-container">
</div>

<div id="tools">
  <button id="btn-add-project" class="btn-add-project" onclick="Project.addProject()">✚</button>
    <!-- ======= BOUTONS DES PROJETS ============ -->
    <span id="project-buttons" class="invisible">
      <button id="btn-remove-project" class="btn-remove-project" onclick="Project.removeCurrentProject.call(Project)">➖</button>
      <button id="btn-move-project-to-left" class="btn-move-project-to-left" onclick="Project.moveCurrentToLeft()">←</button>
      <button id="btn-move-project-to-right" class="btn-move-project-to-right" onclick="Project.moveCurrentToRight()">→</button>
      <button id="btn-deal-project-data" class="svg32" onclick="Project.editData()"><img src="images/base.svg" width="32" /></button>
    </span>
</div>



<script>
(function(){
  var SUPPORTED = ['fr', 'en', 'it', 'de', 'es', 'zh', 'ko', 'hi']
  var lang = null
  try { lang = localStorage.getItem('board-lang') } catch(e) {}
  if (!SUPPORTED.includes(lang)) {
    lang = (navigator.language || 'fr').slice(0, 2).toLowerCase()
  }
  if (!SUPPORTED.includes(lang)) lang = 'fr'
  document.write('<script src="locales/' + lang + '/MESSAGES.js"><\/script>')
  document.write('<script src="locales/' + lang + '/ERRORS.js"><\/script>')
  // Rajout de développement
  document.write('<script src="locales/PATCH_LOCALES.js" defer><\/script>')
  document.documentElement.lang = lang
})()
</script>
<script>
(function(){
  document.title = MESSAGES['Board']
  var toolsBtn = document.getElementById('tools-button')

  var debugBtn = document.getElementById('debug-button')

})()
</script>
